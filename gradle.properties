org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Turns on Metro's experimental Circuit codegen, which generates Presenter.Factory and
# Ui.Factory multibindings from @CircuitInject. No separate Circuit KSP processor needed.
metro.enableCircuitCodegen=true
metro.generateContributionProviders = true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The Compose Multiplatform plugin refuses to configure the macOS target without this opt-in.
# macosArm64 is in our target list, so Compose modules fail configuration without it.
org.jetbrains.compose.experimental.macos.enabled=true

# SPIKE: Swift export is Alpha and warns on every configuration. Silenced so the probe's real
# diagnostics are readable.
kotlin.swift-export.experimental.nowarn=true
