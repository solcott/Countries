name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # io.github.solcott:dataresult* and uistate* resolve from GitHub Packages, which authenticates
  # even public reads. settings.gradle.kts falls back to GITHUB_ACTOR/GITHUB_TOKEN.
  packages: read

jobs:
  build:
    # Linux still compiles the iOS/macOS klibs; it only skips linking the frameworks and running
    # the Apple test binaries. Switch to macos-latest, as kmp-dataresult does, for full Apple
    # coverage. Chrome ships on the runner, so the js/wasmJs browser tests run here.
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corretto 25 matches gradle/gradle-daemon-jvm.properties, so foojay has nothing to provision.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The check half of ktfmtFormat: CI reports, it doesn't rewrite. The root wrapper does not
      # cover build-logic, which is a separate included build.
      - name: Check formatting
        run: ./gradlew ktfmtCheck

      # detekt and the dependency sorter are wired up on build-logic only, so lint it directly.
      - name: Check build-logic
        run: ./gradlew -p build-logic ktfmtCheck checkSortDependencies detekt

      # `build` overlaps the Gradle and Kotlin daemons, Kotlin/Native, R8, webpack and karma's
      # Chrome, and peaks above the runner's 16 GB. When it does, the runner itself is OOM-killed
      # and the job ends as "The operation was canceled" with no Gradle error. The image ships a
      # 4 GB swapfile; a larger one lets the peak page out instead.
      - name: Enlarge swap
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # The sampler prints into this step's own log so the numbers survive the runner being
      # killed; a file or a later step would not.
      - name: Build
        run: |
          ( while sleep 30; do
              echo "::group::resources $(date -u +%T)"
              free -m; df -h / /mnt
              ps -eo rss:10,args --sort=-rss | head -8 | cut -c1-160
              echo "::endgroup::"
            done ) &
          ./gradlew build
