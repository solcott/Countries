[versions]
# Build tooling. AGP 9.x ships built-in Kotlin support pinned to an older KGP; the root
# buildscript classpath overrides it to the Kotlin version Metro and Compose need.
agp = "9.3.0"
kotlin = "2.4.10"
metro = "1.3.2"
apollo = "5.0.1"
apollo-normalized-cache = "1.0.6"
ktfmt = "0.26.0"

# Circuit (MVI). Metro provides the @CircuitInject codegen.
circuit = "0.35.1"

# Compose. Explicit versions rather than the BOM, so the alpha Material3 line can be
# pinned independently of the stable UI/foundation line.
composeUi = "1.11.4"
material3 = "1.5.0-alpha24"

# AndroidX
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

coroutines = "1.11.0"

# Test
junit = "4.13.2"
turbine = "1.2.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# AndroidX core
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "composeUi" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version = "0.6.3" }
# Circuit
circuit-foundation = { module = "com.slack.circuit:circuit-foundation", version.ref = "circuit" }
circuit-retained = { module = "com.slack.circuit:circuit-retained", version.ref = "circuit" }
circuit-runtime = { module = "com.slack.circuit:circuit-runtime", version.ref = "circuit" }
circuit-runtime-presenter = { module = "com.slack.circuit:circuit-runtime-presenter", version.ref = "circuit" }
circuit-runtime-ui = { module = "com.slack.circuit:circuit-runtime-ui", version.ref = "circuit" }
circuit-test = { module = "com.slack.circuit:circuit-test", version.ref = "circuit" }
circuit-codegen-annotations = { module = "com.slack.circuit:circuit-codegen-annotations", version.ref = "circuit" }

# Apollo
apollo-api = { module = "com.apollographql.apollo:apollo-api", version.ref = "apollo" }
apollo-normalized-cache = { module = "com.apollographql.cache:normalized-cache", version.ref = "apollo-normalized-cache" }
apollo-normalized-cache-sqlite = { module = "com.apollographql.cache:normalized-cache-sqlite", version.ref = "apollo-normalized-cache" }
apollo-runtime = { module = "com.apollographql.apollo:apollo-runtime", version.ref = "apollo" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Material
material = { module = "com.google.android.material:material", version = "1.14.0" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Build-plugin classpath deps — see the note on [versions].agp above.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
dependency-sorter = { id = "com.squareup.sort-dependencies", version = "0.20.0" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.5" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
redacted = { id = "dev.zacsweers.redacted", version = "1.18.0" }
