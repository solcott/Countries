[versions]
# Build tooling. AGP 9.x ships built-in Kotlin support pinned to an older KGP; the root
# buildscript classpath overrides it to the Kotlin version Metro and Compose need.
agp = "9.3.1"
kotlin = "2.4.10"
metro = "1.4.1"
apollo = "5.0.1"
apollo-normalized-cache = "1.0.6"
# What normalized-cache-sqlite depends on — the web driver and the npm worker must agree with it.
sqldelight = "2.1.0"
ktfmt = "0.27.0"

# @Parcelize/Parcelable usable from commonMain: real android.os.Parcelable on Android,
# no-ops elsewhere. kotlin-parcelize itself does not support the KMP Android library plugin.
kmp-parcelize = "1.0.4"

# Circuit (MVI). Metro provides the @CircuitInject codegen.
circuit = "0.36.0"

# Compose. Explicit versions rather than the BOM, so the alpha Material3 line can be
# pinned independently of the UI/foundation line.
composeUi = "1.12.0-rc01"
material3 = "1.5.0-alpha25"

# Compose Multiplatform. androidx.compose.foundation is Android-only, so `foundation` (and the
# TextFieldState in CountryListScreen.State) has to come from here.
#
# On the 1.12 line specifically because that is where web gained automatic fallback-font loading:
# Skia has no system font manager in a browser, so before 1.12 every emoji and every non-Latin
# script rendered as tofu. See the fonts note in AGENTS.md — do not bundle fallback fonts.
composeMultiplatform = "1.12.0-rc01"

# Compose Multiplatform's material3 is versioned separately from the rest of CMP — this does NOT
# track composeMultiplatform. 1.12.0-alpha03 is the newest, it wants core 1.12.0-beta01 (which
# resolves up to our rc01), and it aliases androidx material3 1.5.0-alpha22 — older than the
# `material3` above, so ours wins. The CMP plugin's own default accessor is far behind and would
# pull an androidx material3 several minor lines backwards; always set this explicitly.
composeMaterial3 = "1.12.0-alpha03"

# AndroidX
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

coroutines = "1.11.0"

# window/history/DOM types for js and wasmJs from one shared source set. The JS stdlib still ships
# kotlinx.browser; wasmJs never did, and this is where both come from. Pinned to what Compose
# Multiplatform and skiko already put on the web classpath rather than resolving forward.
kotlinxBrowser = "0.5.0"

# Multiplatform logging. Logcat on Android, NSLog on Apple, console on js/wasm — no init needed.
kermit = "2.1.0"

# Test
junit = "4.13.2"
turbine = "1.2.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# AndroidX core
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version = "0.6.4" }

# Compose Multiplatform. `runtime` is a thin alias onto androidx.compose.runtime, which is already
# multiplatform; `foundation` is the real multiplatform build, since androidx's is Android-only.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# Separate version line — see the note on composeMaterial3.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
# The multiplatform replacement for Android res/: strings and drawables in commonMain.
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
# @Preview and friends — annotations only, no runtime code, and published for every target we have.
# The package is `androidx.compose.ui.tooling.preview`, not `org.jetbrains.…`, which is what lets
# Android Studio render commonMain previews and what makes @PreviewScreenSizes available there.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# The renderer Android Studio needs to *draw* those previews. Android and desktop variants only,
# so it can never go in commonMain — see the androidRuntimeClasspath note in ui/build.gradle.kts.
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
# `retain` has no Compose Multiplatform equivalent; androidx publishes this one multiplatform.
androidx-compose-runtime-retain = { module = "androidx.compose.runtime:runtime-retain", version.ref = "composeUi" }
# Circuit
circuit-foundation = { module = "com.slack.circuit:circuit-foundation", version.ref = "circuit" }
circuit-retained = { module = "com.slack.circuit:circuit-retained", version.ref = "circuit" }
circuit-runtime = { module = "com.slack.circuit:circuit-runtime", version.ref = "circuit" }
circuit-runtime-presenter = { module = "com.slack.circuit:circuit-runtime-presenter", version.ref = "circuit" }
circuit-runtime-ui = { module = "com.slack.circuit:circuit-runtime-ui", version.ref = "circuit" }
circuit-test = { module = "com.slack.circuit:circuit-test", version.ref = "circuit" }
circuit-codegen-annotations = { module = "com.slack.circuit:circuit-codegen-annotations", version.ref = "circuit" }

# Apollo
apollo-api = { module = "com.apollographql.apollo:apollo-api", version.ref = "apollo" }
apollo-normalized-cache = { module = "com.apollographql.cache:normalized-cache", version.ref = "apollo-normalized-cache" }
apollo-normalized-cache-sqlite = { module = "com.apollographql.cache:normalized-cache-sqlite", version.ref = "apollo-normalized-cache" }
apollo-runtime = { module = "com.apollographql.apollo:apollo-runtime", version.ref = "apollo" }

# Logging
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kermit-test = { module = "co.touchlab:kermit-test", version.ref = "kermit" }

# Browser
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
# The SqlDriver behind SqlNormalizedCacheFactory on web. Already present transitively via
# normalized-cache-sqlite; declared because :network constructs the driver itself to point it at a
# worker that persists. Pinned to the SQLDelight release normalized-cache-sqlite depends on.
sqldelight-web-worker-driver = { module = "app.cash.sqldelight:web-worker-driver", version.ref = "sqldelight" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Material
material = { module = "com.google.android.material:material", version = "1.14.0" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Build-plugin classpath deps — see the note on [versions].agp above.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
dependency-sorter = { id = "com.squareup.sort-dependencies", version = "0.20.0" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
kmp-parcelize = { id = "io.github.solcott.kmp.parcelize", version.ref = "kmp-parcelize" }
# Needed even though dependencies are declared by coordinate: this plugin configures skiko's
# npm/webpack packaging, which compose.foundation pulls in on js and wasmJs.
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
redacted = { id = "dev.zacsweers.redacted", version = "1.18.0" }
